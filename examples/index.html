<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>chart Example with Marker</title>
  <link rel="stylesheet" href="../dist/sptmChart.css">
  <style>
    #mycanvas {
      margin: 0;
      width: 100%;
      height: 600px;
    }
    .marker-panel {
      margin: 10px 0;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 8px;
    }
    .marker-panel h3 {
      margin: 0 0 10px 0;
      color: #333;
      font-size: 16px;
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.3s;
    }
    .btn:hover {
      opacity: 0.8;
      transform: translateY(-1px);
    }
    .btn-primary {
      background: #239ee7;
      color: white;
    }
    .btn-success {
      background: #4caf50;
      color: white;
    }
    .btn-danger {
      background: #f44336;
      color: white;
    }
    .btn-warning {
      background: #ff9800;
      color: white;
    }
    .btn-info {
      background: #00bcd4;
      color: white;
    }
    .marker-info {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      font-size: 13px;
      color: #666;
    }
    .marker-info span {
      background: #fff;
      padding: 4px 12px;
      border-radius: 4px;
      border-left: 3px solid #239ee7;
    }
    .marker-info span.focus {
      border-left-color: #ff9800;
      color: #ff9800;
      font-weight: bold;
    }
    .panel-section {
      margin: 10px 0;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 8px;
    }
    .panel-section h3 {
      margin: 0 0 10px 0;
      color: #333;
      font-size: 16px;
    }
    .trace-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .trace-item {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #fff;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 13px;
      border-left: 3px solid #ccc;
    }
    .trace-item.active {
      border-left-color: #4caf50;
    }
    .trace-item.hidden {
      border-left-color: #999;
      opacity: 0.6;
    }
    .trace-color {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }
    .trace-name {
      font-weight: 500;
      min-width: 80px;
    }
    .trace-btns {
      display: flex;
      gap: 4px;
    }
    .trace-btns button {
      padding: 2px 8px;
      font-size: 12px;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }
    .trace-btns .btn-hide {
      background: #ff9800;
      color: white;
    }
    .trace-btns .btn-show {
      background: #4caf50;
      color: white;
    }
    .trace-btns .btn-del {
      background: #f44336;
      color: white;
    }
  </style>
</head>
<body>
  <div id="mycanvas" style="color: rebeccapurple;"></div>
  
  <!-- 图表模式控制 -->
  <div class="panel-section">
    <h3>图表模式</h3>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="setChartType('line')">线图模式</button>
      <button class="btn btn-success" onclick="setChartType('waterfall')">瀑布图模式</button>
    </div>
  </div>

  <!-- Marker控制面板 -->
  <div class="panel-section">
    <h3>Marker 控制面板</h3>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="addMarker()">添加Marker</button>
      <button class="btn btn-success" onclick="addMultipleMarkers()">添加3个Marker</button>
      <button class="btn btn-danger" onclick="deleteLastMarker()">删除最后Marker</button>
      <button class="btn btn-warning" onclick="clearAllMarkers()">清除所有</button>
      <button class="btn btn-info" onclick="toggleMarkers()">显示/隐藏</button>
      <button class="btn btn-primary" onclick="moveToRandomFreq()">随机移动焦点Marker</button>
      <button class="btn btn-success" onclick="moveToCenter()">移到中心频率</button>
      <button class="btn btn-danger" onclick="exitFocus()">退出焦点</button>
      <button class="btn btn-info" onclick="switchTrace()">切换谱线</button>
    </div>
    <div class="marker-info" id="markerInfo">
      <span>Marker数量: <strong id="markerCount">0</strong></span>
      <span class="focus">焦点Marker: <strong id="focusMarker">无</strong></span>
      <span>焦点频率: <strong id="focusFreq">--</strong> MHz</span>
      <span>跟随谱线：<strong id="traceId">-</strong></span>
    </div>
  </div>

  <!-- 谱线测试面板 -->
  <div class="panel-section">
    <h3>谱线测试</h3>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="addNormalTrace()">添加普通谱线</button>
      <button class="btn btn-success" onclick="testFreqData()">测试真实频率(freq_data)</button>
      <button class="btn btn-warning" onclick="addCompareTraces()">添加对比谱线(真实vs等间隔)</button>
      <button class="btn btn-danger" onclick="clearAllTraces()">清除所有谱线</button>
    </div>
    <div id="traceList" class="trace-list"></div>
  </div>

  <p>
    <button onclick="changeProperty()">更改门限属性</button>
    <button onclick="changeYAxisProperty()">更改y轴属性</button>
    <button onclick="changeOptions()">更改属性</button>
    <button onclick="getOptions()">获取属性</button>
    <button onclick="stop()">停止</button>
  </p>

  <div id="tip"></div>
  <canvas id="myCanvass" width="500" height="500"></canvas>
  
  <script src="../dist/sptmChart.js"></script>
  <script>
    let sptmCharts = "";

    // 1线 数据存储

        "width": 1,

            "data": dataArr1,
          }
        ]
      }
      // sptmCharts.addTrace(datas3);



      let datas4 = {
        "id": 4,
        "type": "FFT",
        "visibility": true,
        "point": 1600,
        "name": "Trace4",
        "color": "#ff0000",
        "width": 1,
        "datainfo": [
          {
            "point":1600,
            "step":200000000,

          },

            "point":2000,
            "step":200000000,
            "start_freq":1200000000,

    // 更新数据
    function updateData(id){
      let datasArr = generateNumbersWithDominantMiddle(1032, 10, 80);
      let datas=[
          {
            "point":1032,
            "center_freq":200000000,
            "span":100,
            "data":datasArr,
          }
        ]
        // 赋值
        dataInfo.data=datasArr;
        dataInfo.peakdata=mergeArray(datasArr,dataInfo.peakdata);
        dataInfo.avgdata=mergeArrayAvg(datasArr,dataInfo.avgdata,6);
        sptmCharts.setTraceData(id,datas)

        sptmCharts.setTraceData(2,[
          {
            "point":1032,
            "center_freq":200000000,
            "span":100,
            "data":dataInfo.peakdata,
          }
        ])//峰值
        sptmCharts.setTraceData(3,[
          {
            "point":1032,
            "center_freq":200000000,
            "span":100,
            "data":dataInfo.avgdata,
          }
        ])//平均值
    }
    // 传入两个数组，返回一个数组，数组长度为第一个数组长度，数组元素为第一个数组元素和第二个数组元素最大值
    function mergeArray(arr1, arr2) {
      let result = [];
      for (let i = 0; i < arr1.length; i++) {
        result.push(Math.max(arr1[i], arr2[i]));
      }
      return result;
    }
    // 传入两个数组dan的数组，返回一个数组，数组长度为第一个数组长度，数组元素为第一个数组元素和第二个数组元素平均值，保留小数点后n位
    function mergeArrayAvg(arr1, arr2, n) {
      let result = [];
      for (let i = 0; i < arr1.length; i++) {
        result.push(Math.round((arr1[i] + arr2[i]) / 2 * Math.pow(10, n)) / Math.pow(10, n));
      }
      return result;
    }
    // 参数转为数字保留小数点后n位
    function toNumber(num, n) {
      return Math.round(num * Math.pow(10, n)) / Math.pow(10, n);
    }
    function timeLine(){
      setInterval(function() {
        // updateData(1)
        // let datas=[
        //   {
        //     "point":1032,
        //     "center_freq":200000000,
        //     "span":100,
        //     "data":generateNumbersWithDominantMiddle(1032, -20, 58),
        //   }
        // ]
        
        // sptmCharts.setTraceData(1,datas)
        // let datass=[
        //   {
        //     "point":1032,
        //     "center_freq":200000000,
        //     "span":100,
        //     "data":generateNumbersWithDominantMiddle(1032, -6, 5),
        //   }
        // ]
        // sptmCharts.setTraceData(2,datass)

        let datainfo=[
          {
            "point":1600,
            "step":200000000,
            "start_freq":200000000,
            "end_freq":1000000000,
            "width":1,
            "data":generateNumbersWithDominantMiddle(1600, -20, 100),
          },
          {
            "point":2000,
            "step":200000000,
            "start_freq":1200000000,
            "end_freq":2000000000,
            "width":1,
            "data":generateNumbersWithDominantMiddle(2000, -20, 60),
          }
        ]
         sptmCharts.setTraceData(4,datainfo)
      },100)
    }
    // ========== Marker功能函数 ==========
    
    // 添加Marker
    function addMarker() {
      // 或者动态设置单个 Marker
// const markerId = chart.addMarker(true, true);
// const marker = chart._markerList.get(markerId);
// marker.setFollowTraceY(true);
// marker.setTraceYOffset(-15);  // 自定义偏移量

      const id = sptmCharts.addMarker(true, true);
      if (id > 0) {
        console.log('添加Marker成功，ID:', id);
        updateMarkerInfo();
      } else {
        alert('已达到最大Marker数量限制');
      }
    }
    
    // 添加多个Marker
    function addMultipleMarkers() {
      for (let i = 0; i < 3; i++) {
        setTimeout(() => {
          const id = sptmCharts.addMarker(true, i === 2);
          if (id > 0) {
            // 随机位置
            const centerFreq = sptmCharts.options.center_freq;
            const span = sptmCharts.options.span;
            const randomFreq = centerFreq - span/2 + Math.random() * span;
            sptmCharts.moveMarkerByFreq(id, randomFreq);
            console.log(`添加Marker ${id}，频率: ${(randomFreq/1000000).toFixed(2)} MHz`);
          }
        }, i * 200);
      }
      setTimeout(updateMarkerInfo, 1000);
    }
    
    // 删除最后Marker
    function deleteLastMarker() {
      const result = sptmCharts.deleteMarker(0);
      if (result) {
        console.log('删除最后一个Marker');
        updateMarkerInfo();
      }
    }
    
    // 清除所有Marker
    function clearAllMarkers() {
      sptmCharts.clearAllMarkers();
      console.log('清除所有Marker');
      updateMarkerInfo();
    }
    
    // 显示/隐藏Marker
    function toggleMarkers() {
      const markers = sptmCharts.getMarkerList();
      const anyVisible = markers.some(m => m.isVisible());
      markers.forEach(marker => {
        sptmCharts.setMarkerShow(marker.getMarkerID(), !anyVisible);
      });
      console.log(anyVisible ? '隐藏所有Marker' : '显示所有Marker');
    }
    
    // 随机移动焦点Marker
    function moveToRandomFreq() {
      const focusId = sptmCharts.getMarkerFocusId();
      if (focusId === 0) {
        alert('请先添加或选中一个Marker');
        return;
      }
      const centerFreq = sptmCharts.options.center_freq;
      const span = sptmCharts.options.span;
      const randomFreq = centerFreq - span/2 + Math.random() * span;
      const result = sptmCharts.moveMarkerByFreq(focusId, randomFreq);
      if (result) {
        console.log(`移动Marker ${focusId} 到 ${(randomFreq/1000000).toFixed(2)} MHz`);
      }
    }
    
    // 移到中心频率
    function moveToCenter() {
      const focusId = sptmCharts.getMarkerFocusId();
      if (focusId === 0) {
        alert('没有焦点Marker');
        return;
      }
      const centerFreq = sptmCharts.options.center_freq;
      const result = sptmCharts.moveMarkerByFreq(focusId, centerFreq);
      if (result) {
        console.log(`移动Marker ${focusId} 到中心频率`);
      }
    }
    
    // 退出焦点
    function exitFocus() {
      const result = sptmCharts.exitMarkerFocus();
      if (result) {
        console.log('已退出 Marker 焦点');
        updateMarkerInfo();
      } else {
        console.log('当前没有焦点 Marker');
      }
    }
    // 切换 Marker 跟随的谱线
    function switchTrace() {
      const focusId = sptmCharts.getMarkerFocusId();
      if (focusId === 0) {
        alert('请先添加或选中一个 Marker');
        return;
      }
      
      // 获取当前谱线 ID
      const currentTraceId = sptmCharts.getMarkerTraceId(focusId);
      
      // 获取所有可用谱线 ID
      const availableIds = sptmCharts.getAvailableTraceIds();
      
      if (availableIds.length <= 1) {
        alert('只有一条谱线，无法切换');
        return;
      }
      
      // 找到下一条谱线
      let currentIndex = availableIds.indexOf(currentTraceId);
      if (currentIndex === -1) currentIndex = 0;
      
      let nextIndex = (currentIndex + 1) % availableIds.length;
      const nextTraceId = availableIds[nextIndex];
      
      // 设置新的谱线 ID
      const result = sptmCharts.setMarkerTraceId(focusId, nextTraceId);
      if (result) {
        console.log(`Marker #${focusId} 切换到谱线 ${nextTraceId}`);
        updateMarkerInfo();
      }
    }

    // 更新Marker信息显示
    function startMarkerUpdate() {
      setInterval(updateMarkerInfo, 200);
    }
    
    function updateMarkerInfo() {
      const markers = sptmCharts.getMarkerList(true);
      const focusId = sptmCharts.getMarkerFocusId();
      const focusFreq = focusId > 0 ? sptmCharts.getMarkerFreq(focusId) : 0;
      const traceId = focusId > 0 ? sptmCharts.getMarkerTraceId(focusId) : -1;

      document.getElementById('markerCount').textContent = markers.length;
      document.getElementById('focusMarker').textContent = focusId > 0 ? `#${focusId}` : '无';
      document.getElementById('focusFreq').textContent = focusFreq > 0 ? (focusFreq/1000000).toFixed(4) : '--';
      document.getElementById('traceId').textContent = traceId >= 0 ? traceId : '-';
    }

    // ========== 原有函数 ==========
    
    function stop() {
      sptmCharts.stopChart();
    }

    function generateNumbersWithDominantMiddle(count, min, max) {
      const numbers = [];
      for (let i = 0; i < count - 21; i++) {
        const randomNumber = Math.floor(Math.random() * (max - 20 - min + 1)) + min;
        numbers.push(randomNumber);
      }
      const middleNumbers = [];
      const dominantValue = Math.max(...numbers) + 5;
      for (let i = 0; i < 20; i++) {
        middleNumbers.push(dominantValue + Math.floor(Math.random() * 10));
      }
      const insertIndex = Math.floor(count / 2) - 10;
      numbers.splice(insertIndex, 0, ...middleNumbers);
      const medianIndex = Math.floor(count / 2);
      const maxNumber = Math.max(...numbers) + 5;
      numbers.splice(medianIndex, 0, maxNumber);
      return numbers;
    }
    
    function changeProperty() {
      sptmCharts.setThresholdAttribute({
        "visible": true,
        "is_darg": true,
      });
    }
    function changeYAxisProperty() {
      sptmCharts.setOptions({
        "yaxis": {
          "min_value": -20,
          "max_value": 20,
          "floor_value": -20,
          "ceiling_value": 200
        }
      });
    }
    
    function changeOptions() {
      let options = {
        "xaxis": {
          "dscan_freq": [
            {
              "start_freq": 200000000,
              "end_freq": 5000000000,
              "width": 1,
            },
            {
              "start_freq": 6000000000,
              "end_freq": 9000000000,
              "width": 1,
            }
          ]
        },
        "level_tipline": {
          "visible": true,
          "color": "#00afff",
          "width": 1,
        }
      };
      sptmCharts.setOptions(options);
    }
    function getOptions(){
      console.log(sptmCharts.getOptions());
    }

    // ========== freq_data 测试 ==========
    function testFreqData() {
      const pointCount = 1600;
      const dataArr = generateNumbersWithDominantMiddle(pointCount, -20, 100);
      const startFreq = 200000000;
      const endFreq = 1000000000;
      const freqStep = (endFreq - startFreq) / (pointCount - 1);

      // 生成不规则偏移的真实频率数据：正弦波 + 随机噪声
      const freqData = [];
      for (let i = 0; i < pointCount; i++) {
        const baseFreq = startFreq + i * freqStep;
        // 多周期正弦偏移 + 随机噪声，最大偏移约 ±400kHz
        const sineOffset = Math.sin(i / pointCount * Math.PI * 12) * 250000;
        const randomOffset = (Math.random() - 0.5) * 150000;
        const offset = sineOffset + randomOffset;
        freqData.push(Math.round(baseFreq + offset));
      }

      let testData = {
        "id": 5,
        "type": "FFT",
        "visibility": true,
        "point": pointCount,
        "name": "真实频率",
        "color": "#00bcd4",
        "width": 2,
        "datainfo": [
          {
            "point": pointCount,
            "step": 200000000,
            "start_freq": startFreq,
            "end_freq": endFreq,
            "width": 1,
            "data": dataArr,
            "freq_data": freqData
          }
        ]
      };

      sptmCharts.addTrace(testData);
      console.log('真实频率谱线已添加 (id=5)，频率带有正弦+随机偏移', testData);
      updateTraceList();
    }

    // ========== 谱线控制函数 ==========
    function addNormalTrace() {
      const traceId = Date.now();
      let traceData = {
        "id": traceId,
        "type": "FFT",
        "visibility": true,
        "point": 1600,
        "name": "谱线" + traceId,
        "color": "#" + Math.floor(Math.random()*16777215).toString(16),
        "width": 1,
        "datainfo": [
          {
            "point":1600,
            "step":200000000,
            "start_freq":200000000,
            "end_freq":1000000000,
            "width":1,
            "data":generateNumbersWithDominantMiddle(1600, -20, 100),
          }
        ]
      };
      sptmCharts.addTrace(traceData);
      updateTraceList();
      console.log('普通谱线已添加', traceId);
    }

    function addCompareTraces() {
      // 清除旧对比谱线
      try { sptmCharts.removeTrace(100); } catch(e) {}
      try { sptmCharts.removeTrace(101); } catch(e) {}

      const pointCount = 800;
      const startFreq = 200000000;
      const endFreq = 1000000000;
      const freqStep = (endFreq - startFreq) / (pointCount - 1);
      const dataArr = generateNumbersWithDominantMiddle(pointCount, -20, 100);

      // 真实频率：正弦+随机偏移
      const freqData = [];
      for (let i = 0; i < pointCount; i++) {
        const baseFreq = startFreq + i * freqStep;
        const sineOffset = Math.sin(i / pointCount * Math.PI * 8) * 300000;
        const randomOffset = (Math.random() - 0.5) * 100000;
        freqData.push(Math.round(baseFreq + sineOffset + randomOffset));
      }

      // 真实频率谱线
      sptmCharts.addTrace({
        "id": 100,
        "type": "FFT",
        "visibility": true,
        "point": pointCount,
        "name": "真实频率(偏移)",
        "color": "#e91e63",
        "width": 2,
        "datainfo": [{
          "point": pointCount,
          "step": 200000000,
          "start_freq": startFreq,
          "end_freq": endFreq,
          "width": 1,
          "data": dataArr,
          "freq_data": freqData
        }]
      });

      // 等间隔对比谱线
      sptmCharts.addTrace({
        "id": 101,
        "type": "FFT",
        "visibility": true,
        "point": pointCount,
        "name": "等间隔对比",
        "color": "#4caf50",
        "width": 2,
        "datainfo": [{
          "point": pointCount,
          "step": 200000000,
          "start_freq": startFreq,
          "end_freq": endFreq,
          "width": 1,
          "data": dataArr
        }]
      });

      updateTraceList();
      console.log('对比谱线已添加：真实频率(id=100) vs 等间隔(id=101)');
    }

    function clearAllTraces() {
      const traces = sptmCharts.getTraces ? sptmCharts.getTraces() : [];
      traces.forEach(t => {
        if (typeof sptmCharts.removeTrace === 'function') {
          sptmCharts.removeTrace(t.id);
        }
      });
      updateTraceList();
      console.log('所有谱线已清除');
    }

    function setChartType(type) {
      if (typeof sptmCharts.setChartType === 'function') {
        sptmCharts.setChartType(type);
        console.log('图表模式已切换为:', type);
      } else {
        console.warn('当前版本不支持 setChartType，尝试通过 setOptions 切换');
        sptmCharts.setOptions({ chart_type: type });
      }
    }

    function updateTraceList() {
      const container = document.getElementById('traceList');
      if (!container) return;
      const traces = typeof sptmCharts.getTraces === 'function' ? sptmCharts.getTraces() : [];
      if (traces.length === 0) {
        container.innerHTML = '<span style="color:#999;font-size:13px;">暂无谱线</span>';
        return;
      }
      container.innerHTML = traces.map(t => {
        const isVisible = t.visible !== false;
        const color = t.color || '#ccc';
        return `<div class="trace-item ${isVisible ? 'active' : 'hidden'}">
          <span class="trace-color" style="background:${color}"></span>
          <span class="trace-name">${t.name || '未命名'}(ID:${t.id})</span>
          <div class="trace-btns">
            <button class="${isVisible ? 'btn-hide' : 'btn-show'}" onclick="toggleTraceVisibility(${t.id})">${isVisible ? '隐藏' : '显示'}</button>
            <button class="btn-del" onclick="removeTraceById(${t.id})">删除</button>
          </div>
        </div>`;
      }).join('');
    }

    function toggleTraceVisibility(id) {
      const traces = typeof sptmCharts.getTraces === 'function' ? sptmCharts.getTraces() : [];
      const trace = traces.find(t => t.id === id);
      if (trace) {
        const newVisible = !(trace.visible !== false);
        if (typeof sptmCharts.setTraceVisibility === 'function') {
          sptmCharts.setTraceVisibility(id, newVisible);
        } else if (typeof sptmCharts.setTranceVisible === 'function') {
          sptmCharts.setTranceVisible(id, newVisible);
        } else {
          console.warn('当前版本不支持谱线可见性设置');
        }
        updateTraceList();
      }
    }

    function removeTraceById(id) {
      try {
        if (typeof sptmCharts.removeTrace === 'function') {
          sptmCharts.removeTrace(id);
        } else {
          console.warn('当前版本不支持删除谱线');
        }
        updateTraceList();
      } catch(e) {
        console.error('删除谱线失败:', e);
      }
    }
  </script>
</body>
</html>
